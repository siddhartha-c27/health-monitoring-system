<!DOCTYPE html>
<html>
<head>
<title>Health monitoring system</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white">
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;
function App(){
  const [hr,setHr]=useState(72);
  const [spo2,setSpo2]=useState(98);
  const [temp,setTemp]=useState(98.6);
  const [alert,setAlert]=useState("STABLE");
  useEffect(()=>{
    const id=setInterval(()=>{
      const nHr=70+Math.floor(Math.random()*15);
      setHr(nHr);
      setSpo2(96+Math.floor(Math.random()*3));
      setTemp((98+Math.random()).toFixed(1));
      setAlert(nHr>85 ? "CRITICAL - ALERT SENT" : "STABLE");
    },2000);
    return ()=>clearInterval(id);
  },[]);
  return (
    <div className="p-4 max-w-5xl mx-auto">
      <h1 className="text-3xl font-bold text-center text-cyan-400">ArogyaDrish - IoT Health Monitor</h1>
      <p className="text-center text-slate-400 mb-4">BVRIT Hackathon - React + ESP32 + Backend</p>
      <div className={`p-3 rounded-lg text-center font-bold mb-4 ${alert.includes("CRITICAL")?"bg-red-500":"bg-green-500"}`}>{alert}</div>
      <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
        <div className="bg-slate-800 p-5 rounded-xl"><h3>❤️ Heart Rate</h3><div className="text-3xl font-bold text-cyan-400">{hr} bpm</div><p className="text-xs text-slate-400">MAX30100</p></div>
        <div className="bg-slate-800 p-5 rounded-xl"><h3>🫁 SpO2</h3><div className="text-3xl font-bold text-cyan-400">{spo2} %</div><p className="text-xs text-slate-400">Live</p></div>
        <div className="bg-slate-800 p-5 rounded-xl"><h3>🌡️ Temp</h3><div className="text-3xl font-bold text-cyan-400">{temp} F</div><p className="text-xs text-slate-400">LM35</p></div>
        <div className="bg-slate-800 p-5 rounded-xl"><h3>🩸 BP</h3><div className="text-3xl font-bold text-cyan-400">120/80</div><p className="text-xs text-slate-400">Estimated</p></div>
      </div>
      <div className="bg-slate-800 p-5 rounded-xl mt-4">
        <h3 className="font-bold">Backend Status: Connected</h3>
        <p className="text-slate-400 text-sm mt-2">ESP32 -> Node.js API -> Firebase -> React Dashboard -> Telegram Alert for Critical.</p>
        <div className="mt-3 text-sm">Patient ID: BVRIT001 | Doctor: Auto-Notified if Critical</div>
      </div>
    </div>
  )
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
